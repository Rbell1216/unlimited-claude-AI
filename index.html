<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G4F · Multi‑Provider AI Chat & Image Gen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-0: #0a0a0a;
            --bg-1: #111111;
            --bg-2: #181818;
            --bg-3: #202020;
            --bg-4: #2a2a2a;
            --border: rgba(255,255,255,0.07);
            --border-hi: rgba(255,255,255,0.13);
            --accent: #ff6b35;
            --accent-glow: rgba(255,107,53,0.18);
            --accent-hi: #ff7d4d;
            --text-1: #f0f0f0;
            --text-2: #909090;
            --text-3: #505050;
            --green: #34d399;
            --red: #f87171;
            --blue: #60a5fa;
            --font: 'DM Sans', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
            --r: 10px;
            --r-sm: 6px;
            --r-lg: 16px;
            --ease: all 0.18s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { font-family:var(--font); background:var(--bg-0); color:var(--text-1); height:100vh; overflow:hidden; font-size:15px; -webkit-font-smoothing:antialiased; }
        .app { display:flex; height:100vh; }
        .sidebar { width:256px; flex-shrink:0; background:var(--bg-1); border-right:1px solid var(--border); display:flex; flex-direction:column; }
        .sb-head { padding:18px 14px 14px; border-bottom:1px solid var(--border); }
        .logo { display:flex; align-items:center; gap:9px; font-size:16.5px; font-weight:600; letter-spacing:-0.3px; margin-bottom:14px; }
        .logo-mark { width:26px; height:26px; background:var(--accent); border-radius:7px; display:flex; align-items:center; justify-content:center; box-shadow:0 0 14px var(--accent-glow); }
        .new-btn { display:flex; align-items:center; gap:7px; width:100%; background:var(--bg-3); border:1px solid var(--border); color:var(--text-1); font-size:13px; font-weight:500; padding:8px 11px; border-radius:var(--r-sm); cursor:pointer; transition:var(--ease); }
        .sb-body { flex:1; overflow-y:auto; padding:10px 6px; }
        .sec-label { font-size:10px; color:var(--text-3); font-weight:700; text-transform:uppercase; letter-spacing:0.1em; padding:0 8px; margin-bottom:6px; }
        .recent-item { padding:6px 8px; border-radius:var(--r-sm); color:var(--text-2); font-size:12.5px; cursor:pointer; transition:var(--ease); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .recent-item.active { color:var(--text-1); background:var(--bg-3); }
        .sb-foot { padding:10px 6px; border-top:1px solid var(--border); }
        .user-row { display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:var(--r-sm); }
        .user-av { width:28px; height:28px; background:var(--accent); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:white; }
        .main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg-0); }
        .welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; }
        .input-wrap { width:100%; max-width:600px; position:relative; margin-bottom:12px; }
        .chat-input { width:100%; padding:13px 50px 13px 15px; background:var(--bg-2); border:1px solid var(--border); border-radius:var(--r); color:var(--text-1); font-size:14.5px; outline:none; resize:none; min-height:50px; max-height:160px; line-height:1.55; }
        .send-btn { width:32px; height:32px; background:var(--accent); border:none; border-radius:var(--r-sm); color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .model-bar { display:flex; align-items:center; gap:8px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; }
        .provider-pill, .model-pill { display:inline-flex; align-items:center; gap:6px; background:var(--bg-2); border:1px solid var(--border); border-radius:100px; padding:5px 10px; color:var(--text-2); font-size:12px; cursor:pointer; }
        .dropdown { position:absolute; bottom:calc(100% + 6px); left:0; background:var(--bg-2); border:1px solid var(--border-hi); border-radius:var(--r); width:300px; max-height:260px; overflow-y:auto; z-index:200; display:none; }
        .dropdown.open { display:block; }
        .opt { padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; }
        .chat-view { display:none; flex-direction:column; height:100vh; overflow:hidden; }
        .chat-view.active { display:flex; }
        .chat-thread { flex:1; overflow-y:auto; padding:28px 0; }
        .thread-inner { max-width:740px; margin:0 auto; padding:0 24px; }
        .msg { display:flex; gap:12px; margin-bottom:26px; }
        .msg.user { flex-direction:row-reverse; }
        .msg-body { max-width:calc(100% - 41px); }
        .msg.user .msg-body { background:var(--accent); color:white; padding:11px 15px; border-radius:var(--r) 3px var(--r) var(--r); }
        .msg.ai .msg-body { line-height:1.7; }
        .gen-img { width:100%; border-radius:var(--r); margin-top:10px; border:1px solid var(--border); }
        .cin-area { padding:10px 24px 18px; border-top:1px solid var(--border); }
        .cin-inner { max-width:740px; margin:0 auto; }
        .typing { display:none; padding:10px 24px; gap:10px; align-items:center; }
        .typing.on { display:flex; }
        .toast { position:fixed; bottom:22px; right:22px; background:var(--bg-4); padding:8px 13px; border-radius:var(--r-sm); opacity:0; transition:0.2s; pointer-events:none; z-index:9999; }
        .toast.show { opacity:1; }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sb-head">
            <div class="logo"><div class="logo-mark">⚡</div> G4F Omni</div>
            <button class="new-btn" id="newChatBtn">+ New conversation</button>
        </div>
        <div class="sb-body">
            <div class="sec-label">Recent</div>
            <div id="recentList"></div>
        </div>
        <div class="sb-foot">
            <div class="user-row">
                <div class="user-av">R</div>
                <div><div class="user-name">Ryan B.</div><div style="font-size:11px;color:var(--text-3)">IT Professional</div></div>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="welcome" id="welcomeScreen">
            <h2 style="margin-bottom:20px; font-weight:300;">How can I help you today?</h2>
            <div class="input-wrap">
                <textarea class="chat-input" id="welcomeInput" placeholder="Message or type /image..." rows="1"></textarea>
                <div style="position:absolute; right:7px; bottom:7px;">
                    <button class="send-btn" id="welcomeSendBtn">➔</button>
                </div>
            </div>
            <div class="model-bar">
                <div style="position:relative">
                    <button class="provider-pill" id="providerPill">Provider: <span id="providerTxt">pollinations</span></button>
                    <div class="dropdown" id="providerDropdown"></div>
                </div>
                <div style="position:relative">
                    <button class="model-pill" id="modelPill">Model: <span id="modelTxt">gpt-4o</span></button>
                    <div class="dropdown" id="modelDropdown"></div>
                </div>
            </div>
        </div>

        <div class="chat-view" id="chatView">
            <div class="chat-thread" id="chatThread"><div class="thread-inner" id="threadInner"></div></div>
            <div class="typing" id="typingBubble">AI is thinking...</div>
            <div class="cin-area">
                <div class="cin-inner">
                    <textarea class="chat-input" id="chatInput" placeholder="Message or /image..." rows="1"></textarea>
                    <div style="position:absolute; right:35px; bottom:25px;">
                        <button class="send-btn" id="chatSendBtn">➔</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import Client from 'https://g4f.dev/dist/js/client.js';
    const imageClient = new Client();

    const PROVIDERS = [
        { name: 'Pollinations', base: 'https://g4f.space/api/pollinations' },
        { name: 'Groq', base: 'https://g4f.space/api/groq' },
        { name: 'Gemini', base: 'https://g4f.space/api/gemini' }
    ];

    let currentProvider = PROVIDERS[0];
    let currentModel = 'gpt-4o';
    let messages = [];
    let streaming = false;

    // DOM Elements
    const welcomeInput = document.getElementById('welcomeInput');
    const chatInput = document.getElementById('chatInput');
    const threadInner = document.getElementById('threadInner');
    const chatView = document.getElementById('chatView');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const typingBubble = document.getElementById('typingBubble');

    async function sendMessage(text) {
        if (!text.trim() || streaming) return;
        
        showChat();
        appendMessage('user', text);
        messages.push({ role: 'user', content: text });
        
        streaming = true;
        typingBubble.classList.add('on');

        // IMAGE GENERATION LOGIC
        if (text.toLowerCase().startsWith('/image ')) {
            const prompt = text.replace(/\/image /i, '');
            const { bodyEl } = appendMessage('ai', `*Generating image for: "${prompt}"...*`);
            
            try {
                const response = await imageClient.images.generate({
                    model: "flux",
                    prompt: prompt
                });
                const url = response.data[0].url;
                bodyEl.innerHTML = `
                    <p>Here is your generated image:</p>
                    <img src="${url}" class="gen-img" alt="Generated">
                    <a href="${url}" target="_blank" style="color:var(--accent); font-size:12px; text-decoration:none; margin-top:5px; display:block;">↗ Open Full Resolution</a>
                `;
            } catch (e) {
                bodyEl.innerHTML = `<span style="color:var(--red)">Error generating image: ${e.message}</span>`;
            }
            finalizeMessage();
            return;
        }

        // TEXT CHAT LOGIC
        try {
            const { bodyEl } = appendMessage('ai', '');
            const res = await fetch(currentProvider.base + '/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: currentModel,
                    messages: messages,
                    stream: true
                })
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            const content = data.choices[0].delta.content || '';
                            fullText += content;
                            bodyEl.textContent = fullText;
                            scroll();
                        } catch(e) {}
                    }
                }
            }
            messages.push({ role: 'assistant', content: fullText });
        } catch (e) {
            appendMessage('ai', 'Error connecting to provider.');
        }
        finalizeMessage();
    }

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = `
            <div class="msg-av">${role === 'user' ? '👤' : '🤖'}</div>
            <div class="msg-body">${text}</div>
        `;
        threadInner.appendChild(div);
        scroll();
        return { bodyEl: div.querySelector('.msg-body') };
    }

    function finalizeMessage() {
        streaming = false;
        typingBubble.classList.remove('on');
    }

    function showChat() {
        welcomeScreen.style.display = 'none';
        chatView.classList.add('active');
    }

    function scroll() {
        const t = document.getElementById('chatThread');
        t.scrollTop = t.scrollHeight;
    }

    // Basic Listeners
    [welcomeInput, chatInput].forEach(inp => {
        inp.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const val = inp.value;
                inp.value = '';
                sendMessage(val);
            }
        });
    });

    document.getElementById('welcomeSendBtn').onclick = () => {
        const val = welcomeInput.value;
        welcomeInput.value = '';
        sendMessage(val);
    };

    document.getElementById('chatSendBtn').onclick = () => {
        const val = chatInput.value;
        chatInput.value = '';
        sendMessage(val);
    };

    document.getElementById('newChatBtn').onclick = () => {
        location.reload();
    };

</script>
</body>
</html>
