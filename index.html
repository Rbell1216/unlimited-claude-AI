<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G4F · Multi‑Provider AI Chat & Image Gen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-0: #0a0a0a;
            --bg-1: #111111;
            --bg-2: #181818;
            --bg-3: #202020;
            --bg-4: #2a2a2a;
            --border: rgba(255,255,255,0.07);
            --border-hi: rgba(255,255,255,0.13);
            --accent: #ff6b35;
            --accent-glow: rgba(255,107,53,0.18);
            --accent-hi: #ff7d4d;
            --text-1: #f0f0f0;
            --text-2: #909090;
            --text-3: #505050;
            --green: #34d399;
            --red: #f87171;
            --font: 'DM Sans', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --r: 12px;
            --r-sm: 8px;
            --ease: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { font-family:var(--font); background:var(--bg-0); color:var(--text-1); height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased; }

        /* Scrollbars */
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-thumb { background:var(--bg-4); border-radius:10px; }

        .app { display:flex; height:100vh; }

        /* Sidebar */
        .sidebar { width:260px; background:var(--bg-1); border-right:1px solid var(--border); display:flex; flex-direction:column; transition: var(--ease); }
        .sb-head { padding:20px 16px; border-bottom:1px solid var(--border); }
        .logo { display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px; margin-bottom:16px; }
        .logo-mark { width:28px; height:28px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; color:white; font-size:14px; box-shadow:0 0 15px var(--accent-glow); }
        .new-btn { width:100%; padding:10px; background:var(--bg-3); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--text-1); cursor:pointer; font-weight:500; transition:var(--ease); }
        .new-btn:hover { background:var(--bg-4); border-color:var(--border-hi); }

        .sb-body { flex:1; overflow-y:auto; padding:12px; }
        .recent-item { padding:8px 10px; border-radius:var(--r-sm); color:var(--text-2); font-size:13px; cursor:pointer; margin-bottom:4px; transition:var(--ease); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .recent-item:hover { background:var(--bg-3); color:var(--text-1); }

        /* Main Area */
        .main { flex:1; display:flex; flex-direction:column; position:relative; background:radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0a0a0a 100%); }

        /* Welcome */
        .welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
        .welcome h1 { font-weight:300; font-size:32px; margin-bottom:30px; letter-spacing:-0.5px; }

        .input-container { width:100%; max-width:680px; background:var(--bg-2); border:1px solid var(--border); border-radius:var(--r); padding:12px; position:relative; box-shadow:0 10px 40px rgba(0,0,0,0.4); }
        .chat-input { width:100%; background:transparent; border:none; color:var(--text-1); font-family:var(--font); font-size:16px; resize:none; outline:none; padding:8px 45px 8px 8px; min-height:44px; max-height:200px; line-height:1.5; }
        .send-btn { position:absolute; right:12px; bottom:12px; width:34px; height:34px; background:var(--accent); border:none; border-radius:8px; color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--ease); }
        .send-btn:hover { transform:scale(1.05); background:var(--accent-hi); }

        /* Chat View */
        .chat-view { display:none; flex-direction:column; height:100vh; }
        .chat-view.active { display:flex; }
        .thread { flex:1; overflow-y:auto; padding:40px 0; }
        .thread-inner { max-width:760px; margin:0 auto; padding:0 20px; }

        .msg { display:flex; gap:16px; margin-bottom:32px; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .msg.user { flex-direction:row-reverse; }
        .avatar { width:32px; height:32px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:12px; }
        .msg.user .avatar { background:var(--accent); color:white; }
        .msg.ai .avatar { background:var(--bg-3); border:1px solid var(--border); color:var(--text-2); }

        .bubble { max-width:calc(100% - 48px); line-height:1.6; font-size:15.5px; }
        .msg.user .bubble { background:var(--accent); padding:12px 18px; border-radius:18px 4px 18px 18px; color:white; }
        .msg.ai .bubble { color:var(--text-1); padding-top:4px; }

        /* Image Styling */
        .gen-img-card { margin-top:15px; border-radius:var(--r); overflow:hidden; border:1px solid var(--border-hi); background:var(--bg-1); }
        .gen-img { width:100%; display:block; transition: 0.3s; }
        .gen-img:hover { filter: brightness(1.1); }
        .img-meta { padding:10px 15px; display:flex; justify-content:space-between; align-items:center; background:var(--bg-2); }

        /* Typing Indicator */
        .typing { padding:20px; display:none; color:var(--text-3); font-size:13px; font-style:italic; }
        .typing.on { display:block; }

        .bottom-bar { padding:20px; border-top:1px solid var(--border); background:var(--bg-0); }

        /* Dropdowns */
        .controls { display:flex; gap:10px; margin-top:20px; justify-content:center; }
        .pill { background:var(--bg-2); border:1px solid var(--border); padding:6px 14px; border-radius:100px; font-size:12px; color:var(--text-2); cursor:pointer; display:flex; align-items:center; gap:6px; transition:var(--ease); }
        .pill:hover { border-color:var(--accent); color:var(--text-1); }
        .drop-menu { position:absolute; bottom:100%; left:0; background:var(--bg-2); border:1px solid var(--border-hi); border-radius:var(--r-sm); width:200px; display:none; z-index:100; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
        .drop-menu.open { display:block; margin-bottom:8px; }
        .drop-item { padding:10px 12px; font-size:13px; cursor:pointer; transition:var(--ease); }
        .drop-item:hover { background:var(--bg-3); color:var(--accent); }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="sb-head">
            <div class="logo"><div class="logo-mark">G</div> G4F Omni</div>
            <button class="new-btn" id="newChatBtn">+ New Chat</button>
        </div>
        <div class="sb-body">
            <div style="font-size:10px; color:var(--text-3); text-transform:uppercase; font-weight:700; margin-bottom:10px; padding-left:10px;">Recent Activity</div>
            <div id="recentList"></div>
        </div>
    </aside>

    <main class="main">
        <div class="welcome" id="welcomeScreen">
            <h1>What can I create for you?</h1>
            <div class="input-container">
                <textarea class="chat-input" id="welcomeInput" placeholder="Message or type /image..." rows="1"></textarea>
                <button class="send-btn" id="welcomeSendBtn">➔</button>
            </div>
            <div class="controls">
                <div style="position:relative">
                    <div class="pill" id="provPill">Provider: <span id="provTxt">pollinations</span></div>
                    <div class="drop-menu" id="provDrop"></div>
                </div>
                <div style="position:relative">
                    <div class="pill" id="modPill">Model: <span id="modTxt">gpt-4o</span></div>
                    <div class="drop-menu" id="modDrop"></div>
                </div>
            </div>
        </div>

        <div class="chat-view" id="chatView">
            <div class="thread" id="chatThread">
                <div class="thread-inner" id="threadInner"></div>
                <div class="typing" id="typingIndicator">Generating response...</div>
            </div>
            <div class="bottom-bar">
                <div class="thread-inner">
                    <div class="input-container">
                        <textarea class="chat-input" id="chatInput" placeholder="Message or type /image..." rows="1"></textarea>
                        <button class="send-btn" id="chatSendBtn">➔</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import Client from 'https://g4f.dev/dist/js/client.js';
    const imgClient = new Client();

    const PROVIDERS = [
        { name: 'Pollinations', url: 'https://g4f.space/api/pollinations' },
        { name: 'Groq', url: 'https://g4f.space/api/groq' },
        { name: 'Gemini', url: 'https://g4f.space/api/gemini' }
    ];

    let currentProv = PROVIDERS[0];
    let currentMod = 'gpt-4o';
    let chatHistory = [];
    let isBusy = false;

    // Elements
    const wInput = document.getElementById('welcomeInput');
    const cInput = document.getElementById('chatInput');
    const thread = document.getElementById('threadInner');
    const welcome = document.getElementById('welcomeScreen');
    const chatUI = document.getElementById('chatView');

    async function handleSend(text) {
        if (!text.trim() || isBusy) return;
        
        // Switch UI
        welcome.style.display = 'none';
        chatUI.classList.add('active');
        
        appendMsg('user', text);
        chatHistory.push({ role: 'user', content: text });
        
        isBusy = true;
        document.getElementById('typingIndicator').classList.add('on');

        // IMAGE HANDLER
        if (text.toLowerCase().startsWith('/image ')) {
            const prompt = text.replace(/\/image /i, '');
            const { bubble } = appendMsg('ai', `*Synthesizing image for:* "${prompt}"`);
            
            try {
                const response = await imgClient.images.generate({ model: "flux", prompt: prompt });
                const url = response.data[0].url;
                bubble.innerHTML += `
                    <div class="gen-img-card">
                        <img src="${url}" class="gen-img" alt="Generated">
                        <div class="img-meta">
                            <span style="font-size:11px; color:var(--text-3)">Model: FLUX.1</span>
                            <a href="${url}" target="_blank" style="color:var(--accent); text-decoration:none; font-size:12px; font-weight:600;">Download ➔</a>
                        </div>
                    </div>`;
            } catch (err) {
                bubble.innerHTML += `<p style="color:var(--red); margin-top:10px;">Failed to generate image. Please try again.</p>`;
            }
        } 
        // TEXT HANDLER
        else {
            const { bubble } = appendMsg('ai', '');
            try {
                const res = await fetch(currentProv.url + '/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: currentMod, messages: chatHistory, stream: true })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const json = JSON.parse(line.slice(6));
                                const char = json.choices[0].delta.content || '';
                                fullResponse += char;
                                bubble.textContent = fullResponse;
                                scrollDown();
                            } catch(e) {}
                        }
                    }
                }
                chatHistory.push({ role: 'assistant', content: fullResponse });
            } catch (e) {
                bubble.textContent = "Error: Could not reach the provider.";
            }
        }

        isBusy = false;
        document.getElementById('typingIndicator').classList.remove('on');
    }

    function appendMsg(role, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${role}`;
        msgDiv.innerHTML = `
            <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
            <div class="bubble">${content}</div>
        `;
        thread.appendChild(msgDiv);
        scrollDown();
        return { bubble: msgDiv.querySelector('.bubble') };
    }

    function scrollDown() {
        const scroller = document.getElementById('chatThread');
        scroller.scrollTop = scroller.scrollHeight;
    }

    // Interactions
    [wInput, cInput].forEach(el => {
        el.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const val = el.value;
                el.value = '';
                handleSend(val);
            }
        });
    });

    document.getElementById('welcomeSendBtn').onclick = () => { handleSend(wInput.value); wInput.value = ''; };
    document.getElementById('chatSendBtn').onclick = () => { handleSend(cInput.value); cInput.value = ''; };
    document.getElementById('newChatBtn').onclick = () => location.reload();

</script>

</body>
</html>
