<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>G4F · AI Chat + Image Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-0: #0a0a0a;
            --bg-1: #111111;
            --bg-2: #181818;
            --bg-3: #202020;
            --bg-4: #2a2a2a;
            --border: rgba(255, 255, 255, 0.07);
            --border-hi: rgba(255, 255, 255, 0.13);
            --accent: #ff6b35;
            --accent-glow: rgba(255, 107, 53, 0.2);
            --accent-hi: #ff7d4d;
            --text-1: #f0f0f0;
            --text-2: #909090;
            --text-3: #505050;
            --green: #34d399;
            --red: #f87171;
            --blue: #60a5fa;
            --purple: #a78bfa;
            --font: 'DM Sans', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
            --r: 12px;
            --r-sm: 8px;
            --r-lg: 20px;
            --ease: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        html, body {
            height: 100vh;
            overflow: hidden;
            background: var(--bg-0);
            color: var(--text-1);
            font-family: var(--font);
            font-size: 15px;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* sidebar (compact) */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--bg-1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sb-head {
            padding: 18px 14px 12px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .logo-mark {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .new-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: var(--bg-3);
            border: 1px solid var(--border);
            color: var(--text-1);
            font-size: 13px;
            font-weight: 500;
            padding: 9px 12px;
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: var(--ease);
        }

        .new-btn:hover {
            background: var(--bg-4);
            border-color: var(--border-hi);
        }

        .sb-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }

        .sec-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-3);
            padding: 0 8px;
            margin-bottom: 8px;
        }

        .recent-item {
            padding: 6px 10px;
            border-radius: var(--r-sm);
            font-size: 12.5px;
            color: var(--text-2);
            cursor: pointer;
            transition: var(--ease);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-item:hover, .recent-item.active {
            background: var(--bg-3);
            color: var(--text-1);
        }

        .empty-hint {
            padding: 8px;
            color: var(--text-3);
            font-size: 12px;
            font-style: italic;
        }

        /* main area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Welcome */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .w-greeting {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 28px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrap {
            width: 100%;
            max-width: 620px;
            position: relative;
            margin-bottom: 12px;
        }

        .chat-input {
            width: 100%;
            padding: 14px 52px 14px 16px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: var(--r);
            color: var(--text-1);
            font-size: 14.5px;
            font-family: var(--font);
            outline: none;
            resize: none;
            min-height: 52px;
            max-height: 160px;
            line-height: 1.5;
            transition: 0.2s;
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-btns {
            position: absolute;
            right: 10px;
            bottom: 10px;
            display: flex;
            gap: 5px;
        }

        .send-btn {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border: none;
            border-radius: var(--r-sm);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--ease);
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-hi);
            transform: scale(1.05);
        }

        .model-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 16px 0 14px;
        }

        .provider-pill, .model-pill, .image-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 6px 12px;
            font-size: 12px;
            font-family: var(--mono);
            color: var(--text-2);
            cursor: pointer;
            transition: var(--ease);
        }

        .image-pill {
            background: rgba(96, 165, 250, 0.08);
            border-color: rgba(96, 165, 250, 0.3);
            color: var(--blue);
        }

        .image-pill:hover {
            background: var(--bg-3);
            color: #90cdf4;
        }

        .m-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
        }

        .spinning {
            background: var(--text-3);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .dropdown-wrap {
            position: relative;
        }

        .dropdown {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            background: var(--bg-2);
            border: 1px solid var(--border-hi);
            border-radius: var(--r);
            width: 280px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 200;
            display: none;
            backdrop-filter: blur(8px);
        }

        .dropdown.open {
            display: block;
        }

        .opt {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 12.5px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .opt:hover {
            background: var(--bg-3);
        }

        .quick-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .quick-btn {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 7px 15px;
            font-size: 12.5px;
            cursor: pointer;
            transition: var(--ease);
            color: var(--text-2);
        }

        .quick-btn:hover {
            background: var(--bg-3);
            color: var(--text-1);
        }

        /* chat view */
        .chat-view {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .chat-view.active {
            display: flex;
        }

        .chat-thread {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
        }

        .thread-inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .msg {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .msg.user {
            flex-direction: row-reverse;
        }

        .msg-av {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .msg.user .msg-av {
            background: var(--accent);
        }

        .msg.ai .msg-av {
            background: var(--bg-3);
            border: 1px solid var(--border);
        }

        .msg-body {
            max-width: 80%;
        }

        .msg.user .msg-body {
            background: var(--accent);
            padding: 10px 15px;
            border-radius: var(--r) 4px var(--r) var(--r);
        }

        .msg.ai .msg-body {
            background: transparent;
            line-height: 1.6;
        }

        .md p {
            margin-bottom: 10px;
        }

        .md code {
            background: var(--bg-3);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: 12.5px;
        }

        /* image generation card */
        .image-card {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: var(--r);
            margin: 12px 0;
            overflow: hidden;
            transition: 0.2s;
        }

        .image-card img {
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            background: #111;
            display: block;
        }

        .image-actions {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-top: 1px solid var(--border);
            background: var(--bg-1);
        }

        .img-btn {
            background: var(--bg-3);
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            color: var(--text-2);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .img-btn:hover {
            background: var(--bg-4);
            color: white;
        }

        .typing {
            display: none;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
            max-width: 760px;
            padding: 8px 24px;
        }

        .typing.on {
            display: flex;
        }

        .cin-area {
            padding: 12px 24px 20px;
            background: var(--bg-0);
            border-top: 1px solid var(--border);
        }

        .cin-inner {
            max-width: 760px;
            margin: 0 auto;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-4);
            border: 1px solid var(--border-hi);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 680px) {
            .sidebar { display: none; }
            .msg-body { max-width: 90%; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sb-head">
            <div class="logo">
                <div class="logo-mark">✨</div>
                G4F Studio
            </div>
            <button class="new-btn" id="newChatBtn">+ New conversation</button>
        </div>
        <div class="sb-body">
            <div class="sec-label">Recent chats</div>
            <div id="recentList"><div class="empty-hint">—</div></div>
        </div>
    </aside>

    <main class="main">
        <!-- welcome screen -->
        <div class="welcome" id="welcomeScreen">
            <div class="w-greeting">
                <span>🎨</span>
                <span id="greetingText">Creative AI</span>
            </div>
            <div class="input-wrap">
                <textarea class="chat-input" id="welcomeInput" placeholder="Ask anything or generate an image..." rows="1"></textarea>
                <div class="input-btns">
                    <button class="send-btn" id="welcomeSendBtn">➤</button>
                </div>
            </div>

            <div class="model-bar">
                <div class="dropdown-wrap">
                    <button class="provider-pill" id="providerPill"><span class="m-dot" id="providerDot"></span><span id="providerTxt">pollinations</span> ▼</button>
                    <div class="dropdown" id="providerDropdown"><div class="drop-head">Provider</div><div id="providerList"></div></div>
                </div>
                <div class="dropdown-wrap">
                    <button class="model-pill" id="modelPill"><span class="m-dot" id="modelDot"></span><span id="modelTxt">gpt-4o</span> ▼</button>
                    <div class="dropdown" id="modelDropdown"><div class="drop-head">Model</div><div id="modelList"></div></div>
                </div>
                <!-- IMAGE GENERATION PILL (new) -->
                <button class="image-pill" id="imageGenPill">🖼️ Generate image</button>
            </div>

            <div class="quick-btns">
                <button class="quick-btn" data-prompt="Write a haiku about space">✍️ Haiku</button>
                <button class="quick-btn" data-prompt="Explain quantum computing">🧠 Explain</button>
                <button class="quick-btn" data-prompt="Generate image: a cyberpunk cat with neon glasses">🎨 Cyberpunk cat</button>
                <button class="quick-btn" data-prompt="Generate image: surreal mountain with floating islands">🏔️ Surreal landscape</button>
            </div>
        </div>

        <!-- chat view -->
        <div class="chat-view" id="chatView">
            <div class="chat-thread" id="chatThread"><div class="thread-inner" id="threadInner"></div></div>
            <div class="typing" id="typingBubble"><div class="t-av">✨</div><div class="t-dots">...</div></div>
            <div class="cin-area">
                <div class="cin-inner">
                    <textarea class="chat-input" id="chatInput" placeholder="Message or type /image prompt..." rows="1"></textarea>
                    <div class="input-btns"><button class="send-btn" id="chatSendBtn">➤</button></div>
                </div>
            </div>
        </div>
    </main>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

<script>
    (function(){
        // ----- PROVIDER & MODEL STATE (unchanged base) -----
        const PROVIDERS = [
            { name: 'Pollinations', base: 'https://g4f.space/api/pollinations' },
            { name: 'Groq', base: 'https://g4f.space/api/groq' },
            { name: 'Gemini', base: 'https://g4f.space/api/gemini' },
            { name: 'Auto', base: 'https://g4f.space/api/auto' }
        ];
        const FALLBACK_MODELS = ['gpt-4o', 'gpt-4', 'llama-3-70b', 'gemini-pro', 'mistral-large'];
        
        let currentProvider = PROVIDERS[0];
        let currentModel = 'gpt-4o';
        let models = [...FALLBACK_MODELS];
        let messages = [];
        let conversations = [];
        let activeConvId = null;
        let streaming = false;
        let apiKey = localStorage.getItem('g4f_api_key') || '';

        // DOM elements
        const providerPill = document.getElementById('providerPill'), providerTxt = document.getElementById('providerTxt');
        const providerDropdown = document.getElementById('providerDropdown'), providerList = document.getElementById('providerList');
        const modelPill = document.getElementById('modelPill'), modelTxt = document.getElementById('modelTxt');
        const modelDropdown = document.getElementById('modelDropdown'), modelList = document.getElementById('modelList');
        const providerDot = document.getElementById('providerDot'), modelDot = document.getElementById('modelDot');
        const welcomeScreen = document.getElementById('welcomeScreen'), chatView = document.getElementById('chatView');
        const threadInner = document.getElementById('threadInner'), welcomeInput = document.getElementById('welcomeInput');
        const chatInput = document.getElementById('chatInput'), welcomeSendBtn = document.getElementById('welcomeSendBtn');
        const chatSendBtn = document.getElementById('chatSendBtn'), typingBubble = document.getElementById('typingBubble');
        const recentList = document.getElementById('recentList'), newChatBtn = document.getElementById('newChatBtn');
        const toast = document.getElementById('toast'), imageGenPill = document.getElementById('imageGenPill');

        function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2200); }
        function setDot(dot, state){ dot.className='m-dot'; if(state==='loading') dot.classList.add('spinning'); else if(state==='error') dot.style.background='var(--red)'; else dot.style.background='var(--green)'; }
        
        // Provider & model logic
        function renderProviders(){
            providerList.innerHTML='';
            PROVIDERS.forEach(p=>{
                const div=document.createElement('div'); div.className='opt'+(p.base===currentProvider.base?' picked':'');
                div.innerHTML=`<span>${p.name}</span>${p.base===currentProvider.base?'✓':''}`;
                div.onclick=()=>{ currentProvider=p; providerTxt.innerText=p.name.toLowerCase(); fetchModelsForProvider(p.base); providerDropdown.classList.remove('open'); renderProviders(); updateLabels(); };
                providerList.appendChild(div);
            });
        }
        async function fetchModelsForProvider(baseUrl){
            setDot(providerDot,'loading'); setDot(modelDot,'loading');
            try{
                const headers={'Content-Type':'application/json'};
                if(apiKey) headers['Authorization']=`Bearer ${apiKey}`;
                const res=await fetch(baseUrl.replace(/\/$/,'')+'/models',{headers});
                if(!res.ok)throw new Error();
                const data=await res.json();
                let list=data.data||data.models||data;
                if(!Array.isArray(list))list=FALLBACK_MODELS;
                models=list.map(m=>typeof m==='string'?m:m.id).filter(Boolean);
                if(!models.length)models=FALLBACK_MODELS;
                currentModel=models[0];
                setDot(providerDot,'ok'); setDot(modelDot,'ok');
                renderModels();
            }catch(e){ models=FALLBACK_MODELS; currentModel=models[0]; setDot(providerDot,'error'); setDot(modelDot,'error'); renderModels(); }
            modelTxt.innerText=currentModel;
        }
        function renderModels(){
            modelList.innerHTML='';
            models.forEach(m=>{
                const div=document.createElement('div'); div.className='opt'+(m===currentModel?' picked':'');
                div.innerHTML=`<span>${m}</span>${m===currentModel?'✓':''}`;
                div.onclick=()=>{ currentModel=m; modelTxt.innerText=m; modelDropdown.classList.remove('open'); renderModels(); updateLabels(); };
                modelList.appendChild(div);
            });
        }
        function updateLabels(){ /* optional */ }
        
        providerPill.onclick=(e)=>{ e.stopPropagation(); providerDropdown.classList.toggle('open'); modelDropdown.classList.remove('open'); };
        modelPill.onclick=(e)=>{ e.stopPropagation(); modelDropdown.classList.toggle('open'); providerDropdown.classList.remove('open'); };
        document.addEventListener('click',()=>{ providerDropdown.classList.remove('open'); modelDropdown.classList.remove('open'); });
        
        // ----- IMAGE GENERATION (NEW FEATURE) -----
        async function generateAndShowImage(promptText){
            if(streaming){ showToast("Please wait, current action in progress"); return; }
            streaming=true;
            setInputsEnabled(false);
            typingBubble.classList.add('on');
            // append temporary image placeholder message
            const imageMsgDiv = document.createElement('div');
            imageMsgDiv.className = 'msg ai';
            imageMsgDiv.innerHTML = `<div class="msg-av">🖼️</div><div class="msg-body"><div style="background:var(--bg-2); padding:20px; border-radius:12px; text-align:center;">✨ generating image... <span class="s-cur"></span></div></div>`;
            threadInner.appendChild(imageMsgDiv);
            scrollThread();
            
            try {
                // Use G4F client pattern (calls the image generation endpoint via g4f.space)
                const baseImageUrl = currentProvider.base.replace('/api/','/api/'); // but images endpoint uses g4f.dev
                // Since g4f.space doesn't guarantee images, we use the g4f.dev client pattern but through fetch proxy.
                // Official g4f images endpoint: https://g4f.space/api/images/generate (some providers). We'll use Pollinations AI mirror (free)
                // For reliability: call g4f.dev/images endpoint (which works with flux/dalle)
                const imageEndpoint = "https://g4f.space/api/images/generate";
                const requestBody = {
                    model: "flux",
                    prompt: promptText,
                    n: 1
                };
                const headers = { 'Content-Type': 'application/json' };
                if(apiKey) headers['Authorization'] = `Bearer ${apiKey}`;
                
                const response = await fetch(imageEndpoint, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody)
                });
                if(!response.ok){
                    let errDetail = await response.text();
                    throw new Error(`Image API error ${response.status}: ${errDetail.substring(0,100)}`);
                }
                const result = await response.json();
                let imageUrl = null;
                if(result.data && result.data[0] && result.data[0].url) imageUrl = result.data[0].url;
                else if(result.images && result.images[0]) imageUrl = result.images[0];
                else if(result.url) imageUrl = result.url;
                else throw new Error("No image URL in response");
                
                // Replace placeholder with actual image
                imageMsgDiv.innerHTML = `<div class="msg-av">🎨</div><div class="msg-body"><div class="image-card"><img src="${imageUrl}" alt="generated" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/600x400/222/555?text=Failed+to+load'"><div class="image-actions"><button class="img-btn" onclick="window.open('${imageUrl}','_blank')">🔍 Open</button><button class="img-btn" id="copyImgBtn">📋 Copy URL</button></div></div><p style="font-size:12px; color:var(--text-3); margin-top:5px;">✨ Prompt: ${escapeHtml(promptText)}</p></div>`;
                const copyBtn = imageMsgDiv.querySelector('#copyImgBtn');
                if(copyBtn) copyBtn.onclick = ()=>{ navigator.clipboard.writeText(imageUrl); showToast("Image URL copied"); };
                
                // store in conversation history as assistant image generation event (special marker)
                messages.push({ role: 'assistant', content: `![generated image](${imageUrl})\n\n*${promptText}*`, isImage: true, imageUrl: imageUrl });
                saveConversation();
                scrollThread();
            } catch(err){
                console.error(err);
                imageMsgDiv.innerHTML = `<div class="msg-av">⚠️</div><div class="msg-body" style="color:var(--red);">❌ Image generation failed: ${escapeHtml(err.message)}</div>`;
                showToast("Image generation error: "+err.message);
            } finally {
                streaming=false;
                typingBubble.classList.remove('on');
                setInputsEnabled(true);
                chatInput?.focus();
            }
        }
        
        // ----- Chat message handling (streaming) -----
        async function sendMessage(text){
            if(streaming) return;
            // detect image generation command: if starts with "/image" or "generate image:" trigger image mode
            const lower = text.trim().toLowerCase();
            if(lower.startsWith("/image ") || lower.startsWith("generate image:") || lower.startsWith("generate image ")){
                let purePrompt = text.replace(/^\/image\s*/i,'').replace(/^generate image:?\s*/i,'');
                if(!purePrompt) purePrompt = "a beautiful abstract artwork";
                await generateAndShowImage(purePrompt);
                // also add user message for context
                appendUserMessage(text);
                messages.push({ role: 'user', content: text });
                saveConversation();
                return;
            }
            
            streaming=true;
            appendUserMessage(text);
            messages.push({ role: 'user', content: text });
            typingBubble.classList.add('on');
            setInputsEnabled(false);
            try{
                const {bodyEl, cursor} = appendAIMessage();
                let fullText='';
                const headers={'Content-Type':'application/json'};
                if(apiKey) headers['Authorization']=`Bearer ${apiKey}`;
                const resp=await fetch(currentProvider.base+'/chat/completions',{
                    method:'POST', headers, body:JSON.stringify({model:currentModel, messages, stream:true})
                });
                if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
                const reader=resp.body.getReader();
                const decoder=new TextDecoder();
                let buffer='';
                while(true){
                    const {done, value}=await reader.read();
                    if(done)break;
                    buffer+=decoder.decode(value,{stream:true});
                    const lines=buffer.split('\n');
                    buffer=lines.pop()||'';
                    for(const line of lines){
                        if(line.startsWith('data: ')){
                            const data=line.slice(6);
                            if(data==='[DONE]')continue;
                            try{
                                const parsed=JSON.parse(data);
                                const content=parsed.choices?.[0]?.delta?.content||'';
                                if(content){
                                    fullText+=content;
                                    renderMarkdown(fullText, bodyEl, cursor);
                                    scrollThread();
                                }
                            }catch(e){}
                        }
                    }
                }
                cursor.remove();
                renderMarkdown(fullText, bodyEl, null);
                if(window.Prism)Prism.highlightAll();
                messages.push({role:'assistant', content:fullText});
                saveConversation();
            }catch(err){
                typingBubble.classList.remove('on');
                appendErrorMessage(err.message);
                messages.pop();
            }finally{
                streaming=false;
                typingBubble.classList.remove('on');
                setInputsEnabled(true);
                chatInput?.focus();
            }
        }
        
        // UI helpers
        function appendUserMessage(txt){
            const div=document.createElement('div'); div.className='msg user';
            div.innerHTML=`<div class="msg-av">👤</div><div class="msg-body">${escapeHtml(txt)}</div>`;
            threadInner.appendChild(div); scrollThread();
        }
        function appendAIMessage(){
            const div=document.createElement('div'); div.className='msg ai';
            div.innerHTML=`<div class="msg-av">🤖</div><div class="msg-body md"></div>`;
            threadInner.appendChild(div);
            const bodyEl=div.querySelector('.msg-body');
            const cursor=document.createElement('span'); cursor.className='s-cur'; bodyEl.appendChild(cursor);
            scrollThread();
            return {bodyEl, cursor};
        }
        function appendErrorMessage(txt){
            const div=document.createElement('div'); div.className='msg ai';
            div.innerHTML=`<div class="msg-av">⚠️</div><div class="msg-body">${escapeHtml(txt)}</div>`;
            threadInner.appendChild(div); scrollThread();
        }
        function renderMarkdown(src, container, cursor){
            container.innerHTML='';
            const lines=src.split('\n\n');
            for(let p of lines){
                if(!p.trim())continue;
                const el=document.createElement('p');
                el.innerHTML=inlineMarkdown(p);
                container.appendChild(el);
            }
            if(cursor) container.appendChild(cursor);
        }
        function inlineMarkdown(s){
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
                .replace(/\*(.+?)\*/g,'<em>$1</em>')
                .replace(/`(.+?)`/g,'<code>$1</code>')
                .replace(/!\[.*?\]\((.*?)\)/g,'<img src="$1" style="max-width:100%; border-radius:12px; margin:8px 0;" />');
        }
        function escapeHtml(s){ return s.replace(/[&<>]/g, function(m){if(m==='&')return '&amp;'; if(m==='<')return '&lt;'; return '&gt;';}); }
        function scrollThread(){ const t=document.getElementById('chatThread'); if(t) t.scrollTop=t.scrollHeight; }
        function setInputsEnabled(en){ [welcomeInput,chatInput,welcomeSendBtn,chatSendBtn].forEach(el=>{if(el) el.disabled=!en;}); }
        
        function startNewConversation(firstMsg){
            activeConvId='c'+Date.now();
            const title=firstMsg.slice(0,40)+(firstMsg.length>40?'…':'');
            conversations.unshift({id:activeConvId,title,messages:[]});
            if(conversations.length>15) conversations.pop();
            renderRecent();
        }
        function saveConversation(){
            const conv=conversations.find(c=>c.id===activeConvId);
            if(conv){ conv.messages=[...messages]; conv.title=messages.find(m=>m.role==='user')?.content.slice(0,40)||'Conversation'; }
            renderRecent();
        }
        function loadConversation(id){
            const conv=conversations.find(c=>c.id===id);
            if(!conv)return;
            activeConvId=id;
            messages=[...conv.messages];
            threadInner.innerHTML='';
            messages.forEach(m=>{
                if(m.role==='user') appendUserMessage(m.content);
                else if(m.isImage && m.imageUrl){
                    const div=document.createElement('div'); div.className='msg ai';
                    div.innerHTML=`<div class="msg-av">🎨</div><div class="msg-body"><div class="image-card"><img src="${m.imageUrl}" loading="lazy"><div class="image-actions"><button class="img-btn" onclick="window.open('${m.imageUrl}','_blank')">Open</button></div></div></div>`;
                    threadInner.appendChild(div);
                }else{
                    const {bodyEl}=appendAIMessage();
                    renderMarkdown(m.content, bodyEl, null);
                }
            });
            if(window.Prism)Prism.highlightAll();
            showChatView();
        }
        function renderRecent(){
            recentList.innerHTML='';
            if(!conversations.length){ recentList.innerHTML='<div class="empty-hint">No chats</div>'; return; }
            conversations.forEach(c=>{
                const div=document.createElement('div'); div.className='recent-item'+(c.id===activeConvId?' active':'');
                div.textContent=c.title; div.onclick=()=>loadConversation(c.id);
                recentList.appendChild(div);
            });
        }
        function showChatView(){ welcomeScreen.style.display='none'; chatView.classList.add('active'); chatInput.focus(); }
        function resetToWelcome(){ messages=[]; activeConvId=null; threadInner.innerHTML=''; welcomeScreen.style.display=''; chatView.classList.remove('active'); welcomeInput.value=''; welcomeInput.focus(); }
        
        function handleWelcomeSend(){ const msg=welcomeInput.value.trim(); if(!msg||streaming)return; welcomeInput.value=''; startNewConversation(msg); showChatView(); sendMessage(msg); }
        function handleChatSend(){ const msg=chatInput.value.trim(); if(!msg||streaming)return; chatInput.value=''; sendMessage(msg); }
        
        // Image generation pill button (opens prompt dialog)
        imageGenPill.onclick=()=>{
            const prompt=prompt("🎨 Describe the image to generate:","a serene futuristic library");
            if(prompt && prompt.trim()) generateAndShowImage(prompt.trim());
        };
        // quick buttons with image detection
        document.querySelectorAll('.quick-btn').forEach(btn=>{
            btn.onclick=()=>{
                let val=btn.dataset.prompt;
                if(val.includes("Generate image:")){
                    const imgPrompt=val.replace("Generate image:","").trim();
                    generateAndShowImage(imgPrompt);
                }else{
                    welcomeInput.value=val; autoResize(welcomeInput); welcomeInput.focus();
                }
            };
        });
        
        function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,160)+'px'; }
        [welcomeInput,chatInput].forEach(inp=>{ if(inp){ inp.addEventListener('input',()=>autoResize(inp)); inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); inp===welcomeInput?handleWelcomeSend():handleChatSend(); } }); } });
        welcomeSendBtn.onclick=handleWelcomeSend; chatSendBtn.onclick=handleChatSend; newChatBtn.onclick=resetToWelcome;
        const hour=new Date().getHours(); document.getElementById('greetingText').innerText=hour<12?'Good morning ✨':hour<17?'Good afternoon 🌤️':'Good evening 🌙';
        renderProviders(); fetchModelsForProvider(currentProvider.base);
        updateLabels();
    })();
</script>
</body>
</html>
