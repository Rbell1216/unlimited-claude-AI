<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G4F · Text + Image Generation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            height: 100vh;
            overflow: hidden;
        }
        
        .app {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #111111;
            border-right: 1px solid rgba(255,255,255,0.07);
            display: flex;
            flex-direction: column;
        }
        
        .sb-head {
            padding: 20px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        
        .logo {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .new-btn {
            width: 100%;
            padding: 10px;
            background: #202020;
            border: 1px solid rgba(255,255,255,0.07);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .new-btn:hover {
            background: #2a2a2a;
        }
        
        .sb-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }
        
        .sec-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .recent-item {
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #909090;
        }
        
        .recent-item:hover {
            background: #202020;
            color: white;
        }
        
        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Welcome Screen */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .w-greeting {
            font-size: 32px;
            margin-bottom: 30px;
        }
        
        .input-wrap {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 20px;
        }
        
        .chat-input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            background: #181818;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
        }
        
        .chat-input:focus {
            border-color: #ff6b35;
        }
        
        .send-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 34px;
            height: 34px;
            background: #ff6b35;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        
        /* Mode Selector */
        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: #181818;
            padding: 4px;
            border-radius: 100px;
        }
        
        .mode-btn {
            padding: 8px 24px;
            border-radius: 100px;
            font-size: 13px;
            cursor: pointer;
            background: transparent;
            color: #909090;
            border: none;
        }
        
        .mode-btn.active {
            background: #ff6b35;
            color: white;
        }
        
        /* Model Bar */
        .model-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #181818;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 100px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .pill:hover {
            background: #202020;
        }
        
        .auth-chip {
            padding: 6px 12px;
            background: rgba(255,107,53,0.1);
            border: 1px solid rgba(255,107,53,0.2);
            border-radius: 100px;
            font-size: 12px;
            cursor: pointer;
        }
        
        /* Chat View */
        .chat-view {
            display: none;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .chat-view.active {
            display: flex;
        }
        
        .chat-thread {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .thread-inner {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .msg {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .msg.user {
            flex-direction: row-reverse;
        }
        
        .msg-av {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .msg.user .msg-av {
            background: #ff6b35;
        }
        
        .msg.ai .msg-av {
            background: #202020;
        }
        
        .msg-body {
            max-width: 70%;
        }
        
        .msg.user .msg-body {
            background: #ff6b35;
            padding: 10px 16px;
            border-radius: 12px;
        }
        
        .msg.ai .msg-body {
            color: #e0e0e0;
            line-height: 1.6;
        }
        
        .generated-image {
            max-width: 100%;
            border-radius: 12px;
            margin: 10px 0;
            cursor: pointer;
        }
        
        .image-container {
            position: relative;
            display: inline-block;
        }
        
        .image-regenerate, .image-download {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            display: none;
        }
        
        .image-regenerate {
            top: 8px;
            right: 8px;
        }
        
        .image-download {
            bottom: 8px;
            right: 8px;
        }
        
        .image-container:hover .image-regenerate,
        .image-container:hover .image-download {
            display: block;
        }
        
        .typing {
            display: none;
            padding: 0 20px 20px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .typing.on {
            display: flex;
            gap: 10px;
        }
        
        .cin-area {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.07);
            background: #0a0a0a;
        }
        
        .cin-inner {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .cin-meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a2a2a;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .dropdown {
            display: none;
            position: absolute;
            background: #202020;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            min-width: 200px;
            z-index: 100;
        }
        
        .dropdown.open {
            display: block;
        }
        
        .opt {
            padding: 8px 12px;
            cursor: pointer;
        }
        
        .opt:hover {
            background: #2a2a2a;
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sb-head">
            <div class="logo">🎨 G4F Text + Image</div>
            <button class="new-btn" id="newChatBtn">+ New conversation</button>
        </div>
        <div class="sb-body">
            <div class="sec-label">Recent</div>
            <div id="recentList"></div>
        </div>
    </aside>

    <main class="main">
        <!-- Welcome Screen -->
        <div class="welcome" id="welcomeScreen">
            <div class="w-greeting">✨ Hello there</div>
            
            <div class="input-wrap">
                <textarea class="chat-input" id="welcomeInput" placeholder="Type your prompt here..." rows="1"></textarea>
                <button class="send-btn" id="welcomeSendBtn">→</button>
            </div>
            
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="text">💬 Text</button>
                <button class="mode-btn" data-mode="image">🎨 Image</button>
            </div>
            
            <div class="model-bar">
                <div class="pill" id="modelPill">🤖 Model: <span id="modelName">gpt-4o</span></div>
                <div class="auth-chip" id="authNote">🔑 Set API Key</div>
            </div>
        </div>
        
        <!-- Chat View -->
        <div class="chat-view" id="chatView">
            <div class="chat-thread" id="chatThread">
                <div class="thread-inner" id="threadInner"></div>
            </div>
            
            <div class="typing" id="typingBubble">
                <div>🤖</div>
                <div>typing...</div>
            </div>
            
            <div class="cin-area">
                <div class="cin-inner">
                    <div class="cin-meta" id="cinMeta">Mode: Text · Model: gpt-4o</div>
                    <div class="input-wrap">
                        <textarea class="chat-input" id="chatInput" placeholder="Type your message..." rows="1"></textarea>
                        <button class="send-btn" id="chatSendBtn">→</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="toast" id="toast">Ready!</div>

<script>
    // Import G4F
    import Client from 'https://g4f.dev/dist/js/client.js';
    
    const g4fClient = new Client();
    console.log('G4F Client initialized');
    
    // State
    let currentMode = 'text';
    let currentModel = 'gpt-4o';
    let currentImageModel = 'flux';
    let apiKey = localStorage.getItem('g4f_api_key') || '';
    let messages = [];
    let conversations = [];
    let activeConvId = null;
    let streaming = false;
    
    // DOM elements
    const welcomeScreen = document.getElementById('welcomeScreen');
    const chatView = document.getElementById('chatView');
    const threadInner = document.getElementById('threadInner');
    const welcomeInput = document.getElementById('welcomeInput');
    const chatInput = document.getElementById('chatInput');
    const welcomeSendBtn = document.getElementById('welcomeSendBtn');
    const chatSendBtn = document.getElementById('chatSendBtn');
    const typingBubble = document.getElementById('typingBubble');
    const recentList = document.getElementById('recentList');
    const modelName = document.getElementById('modelName');
    const cinMeta = document.getElementById('cinMeta');
    const toast = document.getElementById('toast');
    const authNote = document.getElementById('authNote');
    const newChatBtn = document.getElementById('newChatBtn');
    
    // Set API key in G4F client
    if (apiKey) {
        g4fClient.apiKey = apiKey;
        console.log('API key loaded');
    }
    
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    // Generate Image
    async function generateImage(prompt) {
        if (!g4fClient) {
            showToast('G4F client not ready');
            return null;
        }
        
        try {
            if (apiKey) g4fClient.apiKey = apiKey;
            
            showToast(`Generating image with ${currentImageModel}...`);
            
            const response = await g4fClient.images.generate({
                model: currentImageModel,
                prompt: prompt
            });
            
            const imageUrl = response.data[0].url;
            showToast('Image generated!');
            return imageUrl;
        } catch (err) {
            console.error('Image generation error:', err);
            showToast(`Error: ${err.message}`);
            return null;
        }
    }
    
    // Append image to chat
    function appendImageToChat(imageUrl, prompt) {
        const div = document.createElement('div');
        div.className = 'msg ai';
        div.innerHTML = `
            <div class="msg-av">🎨</div>
            <div class="msg-body">
                <div class="image-container">
                    <img src="${imageUrl}" class="generated-image" alt="${escapeHtml(prompt)}" onclick="window.open(this.src, '_blank')">
                    <button class="image-regenerate" onclick="regenerateImage(this, '${escapeHtml(prompt)}')">🔄 Regenerate</button>
                    <button class="image-download" onclick="downloadImage(this)">💾 Download</button>
                </div>
                <p><strong>Prompt:</strong> ${escapeHtml(prompt)}</p>
                <p><small>Model: ${currentImageModel}</small></p>
            </div>
        `;
        threadInner.appendChild(div);
        scrollThread();
    }
    
    window.regenerateImage = async function(btn, prompt) {
        btn.textContent = '🔄 Generating...';
        btn.disabled = true;
        const newUrl = await generateImage(prompt);
        if (newUrl) {
            const img = btn.parentElement.querySelector('img');
            img.src = newUrl;
            showToast('Image regenerated');
        }
        btn.textContent = '🔄 Regenerate';
        btn.disabled = false;
    };
    
    window.downloadImage = function(btn) {
        const img = btn.parentElement.querySelector('img');
        if (img) {
            const link = document.createElement('a');
            link.href = img.src;
            link.download = `image_${Date.now()}.png`;
            link.click();
            showToast('Download started');
        }
    };
    
    // Text generation
    async function sendTextMessage(text) {
        if (streaming) return;
        streaming = true;
        
        appendUserMessage(text);
        messages.push({ role: 'user', content: text });
        
        typingBubble.classList.add('on');
        
        try {
            const { bodyEl, cursor } = appendAIMessage();
            let fullText = '';
            
            const response = await fetch('https://g4f.space/api/auto/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(apiKey && { 'Authorization': `Bearer ${apiKey}` })
                },
                body: JSON.stringify({
                    model: currentModel,
                    messages: messages,
                    stream: true
                })
            });
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value);
                const lines = buffer.split('\n');
                buffer = lines.pop();
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(data);
                            const content = parsed.choices?.[0]?.delta?.content || '';
                            if (content) {
                                fullText += content;
                                bodyEl.innerHTML = markdownToHtml(fullText);
                                if (cursor) bodyEl.appendChild(cursor);
                                scrollThread();
                            }
                        } catch (e) {}
                    }
                }
            }
            
            if (cursor) cursor.remove();
            messages.push({ role: 'assistant', content: fullText });
            saveConversation();
            
        } catch (err) {
            console.error(err);
            appendErrorMessage(err.message);
        } finally {
            streaming = false;
            typingBubble.classList.remove('on');
        }
    }
    
    // Main handler - routes based on mode
    async function handleSend(text) {
        if (!text.trim() || streaming) return;
        
        if (currentMode === 'image') {
            // Generate image
            typingBubble.classList.add('on');
            
            const imageUrl = await generateImage(text);
            
            typingBubble.classList.remove('on');
            
            if (imageUrl) {
                // Switch to chat view if needed
                if (!activeConvId) {
                    startNewConversation(`Image: ${text.slice(0, 30)}...`);
                    showChatView();
                }
                
                appendImageToChat(imageUrl, text);
                messages.push({ role: 'user', content: `🎨 Generate image: ${text}` });
                messages.push({ role: 'assistant', content: `![Generated Image](${imageUrl})\n\n**Prompt:** ${text}` });
                saveConversation();
            }
        } else {
            // Text generation
            if (!activeConvId) {
                startNewConversation(text);
                showChatView();
            }
            await sendTextMessage(text);
        }
    }
    
    // UI Helpers
    function appendUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'msg user';
        div.innerHTML = `<div class="msg-av">👤</div><div class="msg-body">${escapeHtml(text)}</div>`;
        threadInner.appendChild(div);
        scrollThread();
    }
    
    function appendAIMessage() {
        const msg = document.createElement('div');
        msg.className = 'msg ai';
        msg.innerHTML = `<div class="msg-av">🤖</div><div class="msg-body"></div>`;
        threadInner.appendChild(msg);
        const bodyEl = msg.querySelector('.msg-body');
        const cursor = document.createElement('span');
        cursor.textContent = '▊';
        cursor.style.opacity = '0.7';
        bodyEl.appendChild(cursor);
        scrollThread();
        return { bodyEl, cursor };
    }
    
    function appendErrorMessage(text) {
        const div = document.createElement('div');
        div.className = 'msg ai';
        div.innerHTML = `<div class="msg-av">⚠️</div><div class="msg-body">Error: ${escapeHtml(text)}</div>`;
        threadInner.appendChild(div);
        scrollThread();
    }
    
    function markdownToHtml(text) {
        return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                   .replace(/\*(.+?)\*/g, '<em>$1</em>')
                   .replace(/`(.+?)`/g, '<code>$1</code>')
                   .replace(/\n/g, '<br>');
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function scrollThread() {
        const thread = document.getElementById('chatThread');
        if (thread) thread.scrollTop = thread.scrollHeight;
    }
    
    // Conversation management
    function startNewConversation(firstMsg) {
        activeConvId = Date.now().toString();
        const title = firstMsg.length > 40 ? firstMsg.slice(0, 40) + '...' : firstMsg;
        conversations.unshift({ id: activeConvId, title, messages: [] });
        messages = [];
        renderRecent();
    }
    
    function saveConversation() {
        const conv = conversations.find(c => c.id === activeConvId);
        if (conv) {
            conv.messages = [...messages];
            conv.title = messages[0]?.content.slice(0, 40) + '...' || 'Conversation';
        }
        renderRecent();
    }
    
    function loadConversation(id) {
        const conv = conversations.find(c => c.id === id);
        if (!conv) return;
        
        activeConvId = id;
        messages = [...conv.messages];
        threadInner.innerHTML = '';
        
        messages.forEach(msg => {
            if (msg.role === 'user') {
                appendUserMessage(msg.content);
            } else {
                const { bodyEl } = appendAIMessage();
                bodyEl.innerHTML = markdownToHtml(msg.content);
            }
        });
        
        showChatView();
    }
    
    function renderRecent() {
        if (!recentList) return;
        recentList.innerHTML = '';
        if (conversations.length === 0) {
            recentList.innerHTML = '<div style="color:#666; font-size:12px;">No conversations</div>';
            return;
        }
        conversations.forEach(conv => {
            const div = document.createElement('div');
            div.className = 'recent-item';
            div.textContent = conv.title;
            div.onclick = () => loadConversation(conv.id);
            recentList.appendChild(div);
        });
    }
    
    function showChatView() {
        welcomeScreen.style.display = 'none';
        chatView.classList.add('active');
        chatInput.focus();
    }
    
    function resetToWelcome() {
        messages = [];
        activeConvId = null;
        threadInner.innerHTML = '';
        welcomeScreen.style.display = 'flex';
        chatView.classList.remove('active');
        welcomeInput.value = '';
        welcomeInput.focus();
    }
    
    // Mode switching
    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            if (btn.dataset.mode === mode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        const placeholder = mode === 'image' 
            ? 'Describe the image you want to generate...' 
            : 'Type your message here...';
        chatInput.placeholder = placeholder;
        welcomeInput.placeholder = placeholder;
        
        cinMeta.textContent = mode === 'image' 
            ? `Mode: Image · Model: ${currentImageModel}` 
            : `Mode: Text · Model: ${currentModel}`;
        
        modelName.textContent = mode === 'image' ? currentImageModel : currentModel;
    }
    
    // Event handlers
    function handleWelcomeSend() {
        const text = welcomeInput.value.trim();
        if (text) {
            welcomeInput.value = '';
            handleSend(text);
        }
    }
    
    function handleChatSend() {
        const text = chatInput.value.trim();
        if (text) {
            chatInput.value = '';
            handleSend(text);
        }
    }
    
    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }
    
    // Set API key
    authNote.addEventListener('click', () => {
        const newKey = prompt('Enter your G4F API key:', apiKey);
        if (newKey !== null) {
            apiKey = newKey.trim();
            localStorage.setItem('g4f_api_key', apiKey);
            g4fClient.apiKey = apiKey;
            showToast(apiKey ? 'API key saved' : 'API key cleared');
            authNote.textContent = apiKey ? '✅ API Key Set' : '🔑 Set API Key';
        }
    });
    
    // Model switching (simple for demo)
    document.getElementById('modelPill')?.addEventListener('click', () => {
        const models = currentMode === 'image' 
            ? ['flux', 'dalle-3', 'gpt-image']
            : ['gpt-4o', 'gpt-4', 'claude-3-sonnet', 'gemini-pro'];
        
        const newModel = prompt(`Enter model name (${models.join(', ')}):`, currentMode === 'image' ? currentImageModel : currentModel);
        if (newModel) {
            if (currentMode === 'image') {
                currentImageModel = newModel;
            } else {
                currentModel = newModel;
            }
            setMode(currentMode);
            showToast(`Model changed to ${newModel}`);
        }
    });
    
    // Input handlers
    [welcomeInput, chatInput].forEach(input => {
        input.addEventListener('input', () => autoResize(input));
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (input === welcomeInput) handleWelcomeSend();
                else handleChatSend();
            }
        });
    });
    
    welcomeSendBtn.addEventListener('click', handleWelcomeSend);
    chatSendBtn.addEventListener('click', handleChatSend);
    newChatBtn.addEventListener('click', resetToWelcome);
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });
    
    // Set initial state
    setMode('text');
    if (apiKey) authNote.textContent = '✅ API Key Set';
    
    // Greeting
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    document.querySelector('.w-greeting').textContent = `${greeting}! ✨`;
    
    showToast('Ready! Select mode and type your prompt');
</script>
